<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="pcb" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <!-- Sparse traces -->
      <path d="M10 10 H30 V30" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.8"/>
      <circle cx="30" cy="30" r="2" fill="#ffffff" fill-opacity="0.6"/>
      
      <path d="M70 90 V70 H90" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.8"/>
      <circle cx="70" cy="70" r="2" fill="#ffffff" fill-opacity="0.6"/>

      <!-- Dashed connecting line -->
      <path d="M40 40 L60 60" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.4" stroke-dasharray="2,4"/>
      
      <!-- Isolated node -->
      <circle cx="80" cy="20" r="1.5" fill="#ffffff" fill-opacity="0.5"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#pcb)" />
</svg>
